<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <h1>Novu WebSocket Connection Test</h1>
    <div id="status">Connecting...</div>
    <div id="log"></div>

    <script>
        const subscriberId = '1';
        const applicationIdentifier = 'waSFEThbij4o';
        const socketUrl = 'http://localhost:3002';

        const log = document.getElementById('log');
        const status = document.getElementById('status');

        function addLog(message, color = 'black') {
            const p = document.createElement('p');
            p.style.color = color;
            p.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(p);
        }

        addLog('Attempting to connect to: ' + socketUrl);
        addLog('Subscriber ID: ' + subscriberId);
        addLog('Application ID: ' + applicationIdentifier);

        const socket = io(socketUrl, {
            transports: ['websocket', 'polling'],
            query: {
                subscriberId: subscriberId,
                applicationIdentifier: applicationIdentifier,
            },
            reconnection: true,
            reconnectionDelay: 1000,
            reconnectionAttempts: 5,
        });

        socket.on('connect', () => {
            status.textContent = '✅ Connected';
            status.style.color = 'green';
            addLog('✅ WebSocket connected successfully!', 'green');
        });

        socket.on('notification_received', (notification) => {
            addLog('📬 New notification received!', 'blue');
            addLog(JSON.stringify(notification, null, 2), 'blue');
        });

        socket.on('connect_error', (err) => {
            status.textContent = '❌ Connection Error';
            status.style.color = 'red';
            addLog('❌ Connection error: ' + err.message, 'red');
        });

        socket.on('disconnect', (reason) => {
            status.textContent = '🔌 Disconnected';
            status.style.color = 'orange';
            addLog('🔌 Disconnected: ' + reason, 'orange');
        });

        socket.on('error', (err) => {
            addLog('❌ Error: ' + err, 'red');
        });
    </script>
</body>
</html>
